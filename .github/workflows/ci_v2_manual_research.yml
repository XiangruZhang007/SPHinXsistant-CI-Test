name: CI V2 Manual Research Candidate

# Keep this manual-only workflow on the default branch for GitHub registration.
on:
  workflow_dispatch:
    inputs:
      baseline_key:
        description: Reviewed Registry key for manual mode; leave empty when auto_parent is true
        required: false
        default: ''
        type: string
      auto_parent:
        description: Automatically select the uniquely authorized Trusted Parent
        required: false
        type: boolean
        default: false
      sys_revision:
        description: Exact SPHinXsys commit (moving refs are rejected)
        required: true
        default: 351368e108f47f8d15f89baac96683ecadaee32c
        type: string
      sim_revision:
        description: Exact SPHinXsim commit (moving refs are rejected)
        required: true
        default: dceacd4e509a8592b802cf44bb2885bea7ddfdb3
        type: string
      q1_transport_config:
        description: Optional reviewed Q1 transport config in the checked-out configs/ directory
        required: false
        default: ''
        type: string
      archive_candidate:
        description: Publish the technically verified result as a private immutable research-only Release (no approval)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
      artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      BASELINE_KEY: ${{ inputs.baseline_key }}
      AUTO_PARENT: ${{ inputs.auto_parent }}
      SYS_REVISION: ${{ inputs.sys_revision }}
      SIM_REVISION: ${{ inputs.sim_revision }}
      Q1_TRANSPORT_CONFIG: ${{ inputs.q1_transport_config }}
    steps:
      - name: Check out trusted workflow implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          persist-credentials: false
      - name: Select exact frozen interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12.3'
          architecture: arm64
      - name: Validate Parent selection and trusted build configuration
        run: |
          parent_args=()
          case "$AUTO_PARENT" in
            false)
              if [[ -z "$BASELINE_KEY" ]]; then
                printf '%s\n' 'Manual mode requires baseline_key.' >&2
                exit 2
              fi
              parent_args=(--key "$BASELINE_KEY")
              ;;
            true)
              if [[ -n "$BASELINE_KEY" ]]; then
                printf '%s\n' 'Auto mode requires an empty baseline_key.' >&2
                exit 2
              fi
              parent_args=(--auto-parent)
              ;;
            *)
              printf '%s\n' 'auto_parent must be true or false.' >&2
              exit 2
              ;;
          esac
          python -B scripts/ci_v2_schema2_research.py plan "${parent_args[@]}" \
          --sys-revision "$SYS_REVISION" --sim-revision "$SIM_REVISION" \
          --output "$RUNNER_TEMP/p5a"
      - name: Restore optional pinned Q1 diagnostic inputs
        if: env.Q1_TRANSPORT_CONFIG != ''
        run: >-
          python -B scripts/prepare_q1_inputs.py
          --config "$Q1_TRANSPORT_CONFIG" --runner-temp "$RUNNER_TEMP"
          --output "$RUNNER_TEMP/p5a/q1-transport.json"
      - name: Prepare pinned extraction runtime
        run: |
          git -c credential.helper= clone --no-checkout https://github.com/Consiliency/treesitter-chunker.git tools/treesitter-chunker
          git -C tools/treesitter-chunker checkout --detach fb70922076c773d1865176329a03f67ff893fd90
          python -m venv tools/treesitter-chunker/.venv
          tools/treesitter-chunker/.venv/bin/python -m pip install -r configs/ci_v2_parser_requirements.txt
          tools/treesitter-chunker/.venv/bin/python -m pip install -c configs/ci_v2_parser_requirements.txt -e tools/treesitter-chunker
      - name: Restore, build and evaluate research candidate
        env:
          TRUSTED_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          q1_args=()
          if [[ -n "$Q1_TRANSPORT_CONFIG" ]]; then
            q1_inputs=$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["inputs_path"])' "$RUNNER_TEMP/p5a/q1-transport.json")
            q1_sha=$(python -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["inputs_sha256"])' "$RUNNER_TEMP/p5a/q1-transport.json")
            q1_args=(--q1-inputs "$q1_inputs" --q1-inputs-sha256 "$q1_sha")
          fi
          tools/treesitter-chunker/.venv/bin/python -B scripts/ci_v2_schema2_research.py execute-plan \
          --plan "$RUNNER_TEMP/p5a/plan.json" \
          --work "$RUNNER_TEMP/p5a-work" --output "$RUNNER_TEMP/p5a/run" "${q1_args[@]}"
      - name: Upload candidate evidence or explicit failure report
        if: always()
        id: evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ci-v2-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p5a/*.json
            ${{ runner.temp }}/p5a/run
            ${{ runner.temp }}/p5a/candidate.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Record storage receipt and research restrictions
        if: success()
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              'Research candidate only; automatic approval/reuse=false; production promotion=NOT_AUTHORIZED.\n'
              + 'Artifact ID: ' + os.environ['ARTIFACT_ID'] + '\n'
              + 'Transport digest: ' + os.environ['ARTIFACT_DIGEST'] + '\n')
          PY

  archive-candidate:
    needs: candidate
    if: ${{ inputs.archive_candidate && needs.candidate.result == 'success' && github.ref == 'refs/heads/ci-upstream-refresh' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the archive verification interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12.3'
          architecture: arm64
      - name: Download this run's exact Candidate Artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # verified v8.0.0
        with:
          artifact-ids: ${{ needs.candidate.outputs.artifact_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/candidate-artifact
          merge-multiple: true
          digest-mismatch: error
      - name: Verify and publish immutable research archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_HEAD_SHA: ${{ github.sha }}
          GH_ARTIFACT_ID: ${{ needs.candidate.outputs.artifact_id }}
          GH_ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact_digest }}
        run: >-
          python -B scripts/archive_candidate_release.py
          --artifact-root "${{ runner.temp }}/candidate-artifact"
          --output-dir "${{ runner.temp }}/candidate-release-receipt"
          --repository "$GH_REPOSITORY"
          --run-id "$GH_RUN_ID"
          --attempt "$GH_RUN_ATTEMPT"
          --head-sha "$GH_HEAD_SHA"
          --artifact-id "$GH_ARTIFACT_ID"
          --artifact-digest "$GH_ARTIFACT_DIGEST"
          --publish
      - name: Record Release receipt
        if: success()
        run: |
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path('${{ runner.temp }}/candidate-release-receipt/release-receipt.json').read_text())
          lines = [
              'Research archive: ' + receipt['tag'],
              'Release ID: ' + str(receipt['release_id']),
              'Immutable: ' + str(receipt['immutable']),
              'Candidate ID: ' + receipt['candidate_id'],
              'Release manifest SHA-256: ' + receipt['manifest_sha256'],
              'Technical verification: PASS; research approval: not granted; production: NOT_AUTHORIZED',
              'Assets:',
          ]
          lines.extend(f"- {asset['name']} (ID {asset['asset_id']}): SHA-256 {asset['sha256']}"
                       for asset in receipt['assets'])
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          PY
