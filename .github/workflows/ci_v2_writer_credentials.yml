name: CI V2 Writer Credential Verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-v2-writer-credential-verification
  cancel-in-progress: false

jobs:
  verify-credentials:
    if: >-
      github.repository == 'XiangruZhang007/SPHinXsistant-CI-Test' &&
      github.repository_id == '1455203884' &&
      github.actor_id == '239840087' &&
      github.ref == 'refs/heads/ci-upstream-refresh' &&
      github.run_attempt == 1
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        environment: [ci-v2-audit-writer, ci-v2-automatic-writer]
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      WRITER_ENVIRONMENT: ${{ matrix.environment }}
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact protected verification revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Owner, protected revision and Environment before key access
        run: python3 -I -S -B scripts/verify_ci_v2_writer_credentials.py preflight
      - name: Verify existing App credentials and revoke temporary tokens
        env:
          CI_V2_AUDIT_APP_PRIVATE_KEY: ${{ secrets.CI_V2_AUDIT_APP_PRIVATE_KEY }}
        run: python3 -I -S -B scripts/verify_ci_v2_writer_credentials.py verify
