name: Upstream Refresh Candidate

on:
  workflow_dispatch:
    inputs:
      build_ci_v2:
        description: Explicitly build the detected pair only if CI V2 preflight authorizes it
        required: false
        type: boolean
        default: false
      build_continuous_ci_v2:
        description: Explicit continuous-policy build; requires independently configured Hosted authority
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# This group spans detection, build and durable publication. It is not deduplication.
concurrency:
  group: ci-v2-continuous-lifecycle-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  candidate-refresh:
    runs-on: ubuntu-latest
    outputs:
      execute_candidate: ${{ steps.ci_v2_route.outcome == 'success' && steps.ci_v2_route.outputs.execute_candidate || 'false' }}
      transfer: ${{ steps.ci_v2_route.outputs.transfer }}
      execution_key: ${{ steps.ci_v2_route.outputs.execution_key }}

    steps:
      - name: Check out SPHinXsistant
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize candidate directory
        run: mkdir -p "${{ runner.temp }}/sphinxsistant_candidate"

      - name: Check configured upstream branches
        run: >
          python scripts/check_upstream_updates.py
          --config configs/upstream_baseline.json
          > "${{ runner.temp }}/sphinxsistant_candidate/upstream_status.json"

      - name: Preflight the detected pair without authorizing unattended builds
        id: ci_v2_route
        continue-on-error: true
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
          CI_V2_BUILD_REQUESTED: ${{ inputs.build_ci_v2 }}
        run: |
          mkdir "$RUNNER_TEMP/ci-v2-update"
          adapter_exit=0
          python -B scripts/prepare_ci_v2_update.py \
            --detection "$RUNNER_TEMP/sphinxsistant_candidate/upstream_status.json" \
            --output "$RUNNER_TEMP/ci-v2-update/preflight" || adapter_exit=$?
          python -B scripts/route_ci_v2_update.py export \
            --detection "$RUNNER_TEMP/sphinxsistant_candidate/upstream_status.json" \
            --preflight "$RUNNER_TEMP/ci-v2-update/preflight" \
            --adapter-exit "$adapter_exit" --output "$RUNNER_TEMP/ci-v2-update/routing.json"

      - name: Preserve detection and CI V2 routing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ci-v2-update-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sphinxsistant_candidate/upstream_status.json
            ${{ runner.temp }}/ci-v2-update/
          if-no-files-found: warn
          retention-days: 30

      - name: Clone upstream source repositories
        run: |
          git clone --branch master https://github.com/Xiangyu-Hu/SPHinXsys.git repos/SPHinXsys
          git clone --branch main https://github.com/Xiangyu-Hu/SPHinXsim.git repos/SPHinXsim

      - name: Clone pinned treesitter-chunker
        run: |
          git clone https://github.com/Consiliency/treesitter-chunker.git tools/treesitter-chunker
          git -C tools/treesitter-chunker checkout --detach fb70922076c773d1865176329a03f67ff893fd90

      - name: Install isolated chunk-generation runtime
        run: |
          python -m venv tools/treesitter-chunker/.venv
          tools/treesitter-chunker/.venv/bin/python -m pip install -e tools/treesitter-chunker

      - name: Generate candidate corpus
        run: |
          candidate_dir="${{ runner.temp }}/sphinxsistant_candidate"
          PYTHONDONTWRITEBYTECODE=1 tools/treesitter-chunker/.venv/bin/python scripts/generate_source_chunks_v1.py \
            --output "$candidate_dir/source_chunks_v1.jsonl" \
            --summary "$candidate_dir/source_chunks_v1_summary.json"
          PYTHONDONTWRITEBYTECODE=1 tools/treesitter-chunker/.venv/bin/python scripts/generate_sphinxsim_source_chunks_v1.py \
            --sys-input "$candidate_dir/source_chunks_v1.jsonl" \
            --sys-summary-input "$candidate_dir/source_chunks_v1_summary.json" \
            --sim-output "$candidate_dir/sphinxsim_source_chunks_v1.jsonl" \
            --sim-summary-output "$candidate_dir/sphinxsim_source_chunks_v1_summary.json" \
            --combined-output "$candidate_dir/source_chunks_v1_combined.jsonl" \
            --combined-summary-output "$candidate_dir/source_chunks_v1_combined_summary.json"

      - name: Run deterministic retrieval regression
        run: |
          candidate_dir="${{ runner.temp }}/sphinxsistant_candidate"
          PYTHONDONTWRITEBYTECODE=1 tools/treesitter-chunker/.venv/bin/python scripts/retrieve_v1.py \
            --corpus "$candidate_dir/source_chunks_v1_combined.jsonl" \
            --validation-report "$candidate_dir/retrieval_v1_initial.json" \
            --write-initial-validation

      - name: Upload candidate refresh artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sphinxsistant-candidate-refresh
          path: ${{ runner.temp }}/sphinxsistant_candidate
          if-no-files-found: error

  candidate:
    needs: candidate-refresh
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.build_ci_v2 && !inputs.build_continuous_ci_v2 && needs.candidate-refresh.outputs.execute_candidate == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    concurrency:
      group: ci-v2-update-${{ github.repository_id }}-${{ needs.candidate-refresh.outputs.execution_key }}
      cancel-in-progress: false
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      CI_V2_BUILD_REQUESTED: ${{ inputs.build_ci_v2 }}
      CI_V2_TRANSFER: ${{ needs.candidate-refresh.outputs.transfer }}
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select exact frozen interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12.3'
          architecture: arm64
      - name: Revalidate transferred evidence and restore the original Plan
        run: python -B scripts/route_ci_v2_update.py restore --output "$RUNNER_TEMP/p5a"
      - name: Prepare pinned extraction runtime
        run: |
          git -c credential.helper= clone --no-checkout https://github.com/Consiliency/treesitter-chunker.git tools/treesitter-chunker
          git -C tools/treesitter-chunker checkout --detach fb70922076c773d1865176329a03f67ff893fd90
          python -m venv tools/treesitter-chunker/.venv
          tools/treesitter-chunker/.venv/bin/python -m pip install -r configs/ci_v2_parser_requirements.txt
          tools/treesitter-chunker/.venv/bin/python -m pip install -c configs/ci_v2_parser_requirements.txt -e tools/treesitter-chunker
      - name: Restore, build and evaluate research candidate
        env:
          TRUSTED_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tools/treesitter-chunker/.venv/bin/python -B scripts/ci_v2_schema2_research.py execute-plan \
            --plan "$RUNNER_TEMP/p5a/plan.json" \
            --work "$RUNNER_TEMP/p5a-work" --output "$RUNNER_TEMP/p5a/run"
      - name: Upload candidate evidence or explicit failure report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ci-v2-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p5a/plan.json
            ${{ runner.temp }}/p5a/run
            ${{ runner.temp }}/p5a/candidate.tar.gz
          if-no-files-found: error
          retention-days: 30

  # Scheduled routing is evidence-only. This job has no build or publication step.
  continuous-schedule-preflight:
    needs: candidate-refresh
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      CONTINUOUS_BUILD_DEPLOYMENT_JSON: ${{ vars.CONTINUOUS_BUILD_DEPLOYMENT_JSON }}
      CONTINUOUS_BUILD_DEPLOYMENT_SHA256: ${{ vars.CONTINUOUS_BUILD_DEPLOYMENT_SHA256 }}
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select exact frozen interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12.3'
          architecture: arm64
      - name: Download only this attempt's detection evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # verified v8.0.0
        with:
          name: ci-v2-update-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/continuous-detection
          digest-mismatch: error
      - name: Prepare pinned extraction runtime
        run: |
          git -c credential.helper= clone --no-checkout https://github.com/Consiliency/treesitter-chunker.git tools/treesitter-chunker
          git -C tools/treesitter-chunker checkout --detach fb70922076c773d1865176329a03f67ff893fd90
          python -m venv tools/treesitter-chunker/.venv
          tools/treesitter-chunker/.venv/bin/python -m pip install -r configs/ci_v2_parser_requirements.txt
          tools/treesitter-chunker/.venv/bin/python -m pip install -c configs/ci_v2_parser_requirements.txt -e tools/treesitter-chunker
      - name: Verify scheduled context and record blockers without constructing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tools/treesitter-chunker/.venv/bin/python -B scripts/run_continuous_ci_v2.py --preflight-only \
            --detection "$RUNNER_TEMP/continuous-detection/sphinxsistant_candidate/upstream_status.json" \
            --work "$RUNNER_TEMP/continuous-work" --output "$RUNNER_TEMP/continuous-result"
      - name: Preserve scheduled preflight or explicit failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ci-v2-continuous-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/continuous-result/
          if-no-files-found: error
          retention-days: 30

  continuous-candidate:
    needs: candidate-refresh
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.build_continuous_ci_v2 && !inputs.build_ci_v2) || (github.event_name == 'schedule' && vars.CONTINUOUS_CONSTRUCTION_ENABLED == 'true' && vars.CONTINUOUS_PUBLICATION_ENABLED == 'true')) }}
    outputs:
      candidate_built: ${{ steps.continuous.outputs.candidate_built }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ci-v2-continuous-${{ github.repository_id }}
      cancel-in-progress: false
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      CONTINUOUS_BUILD_DEPLOYMENT_JSON: ${{ vars.CONTINUOUS_BUILD_DEPLOYMENT_JSON }}
      CONTINUOUS_BUILD_DEPLOYMENT_SHA256: ${{ vars.CONTINUOUS_BUILD_DEPLOYMENT_SHA256 }}
      CONTINUOUS_CONSTRUCTION_ENABLED: ${{ vars.CONTINUOUS_CONSTRUCTION_ENABLED }}
      CONTINUOUS_PUBLICATION_ENABLED: ${{ vars.CONTINUOUS_PUBLICATION_ENABLED }}
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select exact frozen interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12.3'
          architecture: arm64
      - name: Download only this attempt's detection evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # verified v8.0.0
        with:
          name: ci-v2-update-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: ${{ runner.temp }}/continuous-detection
          digest-mismatch: error
      - name: Prepare pinned extraction runtime
        run: |
          git -c credential.helper= clone --no-checkout https://github.com/Consiliency/treesitter-chunker.git tools/treesitter-chunker
          git -C tools/treesitter-chunker checkout --detach fb70922076c773d1865176329a03f67ff893fd90
          python -m venv tools/treesitter-chunker/.venv
          tools/treesitter-chunker/.venv/bin/python -m pip install -r configs/ci_v2_parser_requirements.txt
          tools/treesitter-chunker/.venv/bin/python -m pip install -c configs/ci_v2_parser_requirements.txt -e tools/treesitter-chunker
      - name: Verify authority and execute the exact detected pair
        id: continuous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tools/treesitter-chunker/.venv/bin/python -B scripts/run_continuous_ci_v2.py \
            --detection "$RUNNER_TEMP/continuous-detection/sphinxsistant_candidate/upstream_status.json" \
            --work "$RUNNER_TEMP/continuous-work" --output "$RUNNER_TEMP/continuous-result"
      - name: Preserve continuous Candidate or explicit failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ci-v2-continuous-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/continuous-result/
          if-no-files-found: error
          retention-days: 30

  publish-continuous-candidate:
    needs: continuous-candidate
    # Missing Variables evaluate to empty, so real publication is disabled by default.
    if: ${{ always() && github.event_name == 'schedule' && needs.continuous-candidate.result == 'success' && needs.continuous-candidate.outputs.candidate_built == 'true' && vars.CONTINUOUS_PUBLICATION_ENABLED == 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      PYTHONHASHSEED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
      CONTINUOUS_BUILD_DEPLOYMENT_JSON: ${{ vars.CONTINUOUS_BUILD_DEPLOYMENT_JSON }}
      CONTINUOUS_BUILD_DEPLOYMENT_SHA256: ${{ vars.CONTINUOUS_BUILD_DEPLOYMENT_SHA256 }}
      CONTINUOUS_PUBLICATION_ENABLED: ${{ vars.CONTINUOUS_PUBLICATION_ENABLED }}
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select exact frozen interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5
        with:
          python-version: '3.12.3'
          architecture: arm64
      - name: Prepare pinned verification runtime
        run: |
          git -c credential.helper= clone --no-checkout https://github.com/Consiliency/treesitter-chunker.git tools/treesitter-chunker
          git -C tools/treesitter-chunker checkout --detach fb70922076c773d1865176329a03f67ff893fd90
          python -m venv tools/treesitter-chunker/.venv
          tools/treesitter-chunker/.venv/bin/python -m pip install -r configs/ci_v2_parser_requirements.txt
          tools/treesitter-chunker/.venv/bin/python -m pip install -c configs/ci_v2_parser_requirements.txt -e tools/treesitter-chunker
      - name: Independently verify original build ZIP and publish immutable evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tools/treesitter-chunker/.venv/bin/python -B scripts/publish_continuous_candidate.py \
            --output "$RUNNER_TEMP/continuous-publication"
      - name: Preserve publication result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # verified v4
        with:
          name: ci-v2-continuous-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/continuous-publication/
          if-no-files-found: error
          retention-days: 30
